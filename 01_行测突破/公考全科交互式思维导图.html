<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <title>四川省考（省市综合管理）全科作战全景思维导图</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;

    body, html {
      width: 100%;

      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;

      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;

      justify-content: space-between;

    }
    .title-box {
      display: flex;

    .badge {
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: white;

      transform: translateY(-1px);
    }
    #mindmap {
      width: 100%;
      height: 100%;
      padding-top: 60px;
    }
    .markmap {
      width: 100%;
      height: 100%;
    }
    .markmap-node text {
      font-weight: 500;
      font-size: 13px;
    }
    .footer-tip {
      position: absolute;
      bottom: 16px;
      left: 24px;
      font-size: 12px;
      color: #94a3b8;
      background: rgba(15, 23, 42, 0.7);
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      pointer-events: none;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.15.4"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.15.4/dist/browser/index.js"></script>
</head>
<body>
  <header>
    <div class="title-box">
      <span class="badge">四川省考 · 冲刺138+</span>
      <h1>行测全科作战全景思维导图（高交互可视化看板）</h1>
    </div>
    <div class="btn-group">
      <button onclick="zoomFit()">🎯 适应屏幕</button>
      <button onclick="toggleExpandAll()">🔄 展开 / 折叠全部</button>
      <button onclick="toggleFullScreen()">⛶ 全屏沉浸浏览</button>
    </div>
  </header>

  <svg id="mindmap" class="markmap"></svg>
  <div class="footer-tip">🖱️ 操作指南：鼠标滚轮缩放 | 按住左键拖动画布 | 点击彩色圆点可展开/折叠对应分支</div>

  <script>
    const markdownContent = `# 四川省考（省市综合管理）行测全科作战思维导图

## 01 资料分析（目标：14+题 / 限时：25min）
### 实用速算技巧
- 加减法
  - 高位叠加（从左往右加）
  - 削峰填谷（找基准值平衡）
  - 尾数法（首末不同秒杀）
- 截位直除法（A/B）
  - 选项首位不同 $\\rightarrow$ 分母截2位
  - 首位同第二位不同 $\\rightarrow$ 分母截3位
- 百化分速算表
  - 基础小分：$50\\% = 1/2$ | $33.3\\% = 1/3$ | $25\\% = 1/4$ | $20\\% = 1/5$
  - 高频六七八：$16.7\\% = 1/6$ | $14.3\\% = 1/7$ | $12.5\\% = 1/8$
  - 易混九十一：$11.1\\% = 1/9$ | $9.1\\% = 1/11$
  - 进阶小分：$8.3\\% = 1/12$ | $7.7\\% = 1/13$ | $7.1\\% = 1/14$ | $6.25\\% = 1/16$
- 化除为乘（$|r| \\le 5\\%$）
  - 正增长：$A \\approx B \\times (1 - r)$
  - 负增长：$A \\approx B \\times (1 + r)$
### ABRX 四大核心公式
- 字母含义：$A$基期 | $B$现期 | $R$增速 | $X$增量
- 求现期：$B = A \\times (1 + R)$
- 求基期：$A = \\frac{B}{1 + R}$
- 求增长率：$R = \\frac{X}{A} = \\frac{X}{B - X}$
  - ⚠️【防坑】：知现期与增量，分母严禁直除现期B！
- 求增长量（正增长）：$X = \\frac{B}{n + 1}$（令 $R \\approx 1/n$）
- 求减少量（负增长）：$X = \\frac{B}{n - 1}$
  - ⚠️【防坑】：负增长必除以 $n - 1$，严禁直乘现期！
### 进阶增长率
- 隔年增长率：$R = r_1 + r_2 + r_1 \\times r_2$
- 混合增长率（十字交叉/线段法）
  - 居中偏大（介于两者之间，偏向基期基数大的一方）
- 比值增长率（平均数增速）：$r = \\frac{a - b}{1 + b}$
### 比重与平均数
- 现期比重：$\\text{比重} = \\text{部分} / \\text{整体}$
- 基期比重：$\\frac{A}{B} \\times \\frac{1 + b}{1 + a}$
- 两期比重比较
  - 升降判定：部分增速 $a >$ 整体增速 $b \\rightarrow$ 比重上升
  - 差值口诀：差值绝对值 $< |a - b|$

## 02 言语理解（目标：24+题 / 限时：30min）
### 中心理解题
- 路标词抓题眼
  - 转折词（后文重点）：但是、然而、却、事实上
  - 因果词（结论重点）：因此、可见、所以、导致
  - 对策词（核心论点）：必须、亟须、应当、关键在于
- 错误项特征：背景引入、例子细节、转折前非重点、偷换概念
### 逻辑填空
- 语境对应
  - 并列对应（顿号/分号）：找近义词
  - 转折对应（不是...而是...）：找反义词
  - 解释说明（冒号/破折号）：找原词对应
- 易混望文生义成语排雷
  - 差强人意：大体满意 $\\neq$ 不满意
  - 首当其冲：最先遭殃 $\\neq$ 首先做某事
  - 炙手可热：气焰极盛贬义 $\\neq$ 热门畅销
  - 空穴来风：有根据 $\\neq$ 捕风捉影
### 语句表达
- 语句排序：抓首句（下定义/背景入）+ 抓捆绑（代词/关联词绑定）
- 接语推断：紧扣最后一句尾巴

## 03 判断推理（目标：24+题 / 限时：35min）
### 图形推理（五大特征分类）
- 位置规律：平移、旋转、翻转
- 样式规律：叠加、去同存异、黑白运算
- 属性规律：对称性（轴/中心）、曲直性、开闭性
- 数量规律：点、线（一笔画）、面、素、角
- 空间重构：相对面排除、公共边特性
### 定义判断
- 关键要素提炼：主体、客体、条件、目的
- 选项严格对照排除
### 类比推理
- 语义关系：近反义、比喻象征
- 逻辑关系：全同、并列（矛盾/反对）、包含、交叉
- 语法关系：主谓、动宾、偏正
### 逻辑判断
- 翻译推理
  - 前推后：如果...那么...
  - 后推前：只有...才...
  - 逆否规则：肯前必肯后，否后必否前
- 论证削弱与加强
  - 削弱：削弱论点 $>$ 拆桥 $>$ 另有他因 $>$ 削弱论据
  - 加强：加强论点 $>$ 搭桥 $>$ 排除他因 $>$ 补充论据

## 04 数量关系（目标：拿5~6题 / 限时：12min）
### 必拿母题类型（挑3~4题精做）
- 工程问题：赋总量（公倍数）或赋效率
- 经济利润：进价/售价/打折/利润率公式列方程
- 容斥原理：两集合/三集合公式画图法
- 和差倍比：代入排除法、二元一次方程组
### 科学蒙题法则（保底拿5~6题）
- 选项均匀分布律（ABCD各占约2~3个）
- 做出3道后，剩余题全蒙同一个未出现的选项
`;

    let mm;
    let isExpanded = false;

    window.onload = () => {
      const { Transformer } = window.markmap;
      const transformer = new Transformer();
      const { root } = transformer.transform(markdownContent);
      
      const svg = document.getElementById('mindmap');
      mm = window.markmap.Markmap.create(svg, {
        duration: 300,
        color: (node) => {
          const colors = ['#3b82f6', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6', '#06b6d4'];
          return colors[node.state.depth % colors.length];
        },
        paddingX: 20,
        autoFit: true
      }, root);
    };

    function zoomFit() {
      if (mm) mm.fit();
    }

    function toggleExpandAll() {
      if (!mm) return;
      isExpanded = !isExpanded;
      function setFold(node, fold) {
        if (node.children) {
          node.payload = { ...node.payload, fold: fold ? 1 : 0 };
          node.children.forEach(c => setFold(c, fold));
        }
      }
      setFold(mm.state.data, !isExpanded);
      mm.renderData();
      mm.fit();
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }
  </script>
</body>
</html>
